
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Online Portfolio</title>

  <script src="https://d3js.org/d3.v4.js"></script>

  <style>
    body {
      background-color: #E3DCDC;
      font-family: "Lucida Console", monospace;
    }

    h1 {
      font-family: "Lucida Console", monospace;
      font-style: italic;
      text-align: center;
    }

    p {
      font-family: "Lucida Console", monospace;
      text-align: center;
    }

    #my_dataviz {
      text-align: center;
      margin: 20px auto;
      overflow-x: auto;
    }

    .image {
      background: #cecece;
      display: block;
      width: 80%;
      height: 250px;
      margin: 20px auto;
      opacity: 0.8;
      cursor: pointer;
      text-align: center;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <h1>My Online Portfolio</h1>

  <p>
    I'm Sarah Ford. Here is my online portfolio for Data Journalism F26.
  </p>

  <div class="image">
    <img
      src="https://www.binghamton.edu/assets/sites/directory/img/hi-res/employee/sford5.jpg?resolution=200"
      alt="Sarah Ford"
    >
  </div>

  <div id="my_dataviz"></div>

  <script>
    // Set the dimensions and margins of the graph
    var margin = {
      top: 30,
      right: 30,
      bottom: 100,
      left: 60
    };

    var width = 600 - margin.left - margin.right;
    var height = 400 - margin.top - margin.bottom;

    // Append the SVG object to the chart container
    var svg = d3.select("#my_dataviz")
      .append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
      .append("g")
      .attr(
        "transform",
        "translate(" + margin.left + "," + margin.top + ")"
      );

    // Load the CSV data
    d3.csv(
      "https://raw.githubusercontent.com/holtzy/data_to_viz/master/Example_dataset/7_OneCatOneNum_header.csv",
      function(error, data) {
        if (error) {
          console.error("Error loading chart data:", error);
          d3.select("#my_dataviz")
            .append("p")
            .text("Unable to load chart data.");
          return;
        }

        // Convert values to numbers
        data.forEach(function(d) {
          d.Value = +d.Value;
        });

        // X axis
        var x = d3.scaleBand()
          .range([0, width])
          .domain(data.map(function(d) {
            return d.Country;
          }))
          .padding(0.2);

        svg.append("g")
          .attr("transform", "translate(0," + height + ")")
          .call(d3.axisBottom(x))
          .selectAll("text")
          .attr("transform", "translate(-10,0)rotate(-45)")
          .style("text-anchor", "end");

        // Y axis
        var y = d3.scaleLinear()
          .domain([0, 13000])
          .range([height, 0]);

        svg.append("g")
          .call(d3.axisLeft(y));

        // Bars
        svg.selectAll(".bar")
          .data(data)
          .enter()
          .append("rect")
          .attr("class", "bar")
          .attr("x", function(d) {
            return x(d.Country);
          })
          .attr("y", function(d) {
            return y(d.Value);
          })
          .attr("width", x.bandwidth())
          .attr("height", function(d) {
            return height - y(d.Value);
          })
          .attr("fill", "#69b3a2");
      }
    );
  </script>
</body>
</html>
