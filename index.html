<!DOCTYPE html>
<html lang="en">
<head>
<title>My Online Portfolio</title>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #E3DCDC;
      font-family: "Lucida Console", monospace;
    }

    h1 {
      font-family: "Lucida Console", monospace;
      font-style: italic;
      text-align: center;
    }

    p {
      font-family: "Lucida Console", monospace;
      text-align: center;
    }

    .image {
      background: #cecece;
      display: block;
      width: 80%;
      height: 250px;
      margin: 20px auto;
      opacity: 0.8;
      cursor: pointer;
      text-align: center;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .chart-container {
    width: 90%;
    max-width: 800px;
    margin: 30px auto;
    }
  </style>
</head>

<body>
  <h1>My Online Portfolio</h1>

  <p>
    I'm Sarah Ford. Here is my online portfolio for Data Journalism F26.
  </p>

  <div class="image">
    <img
      src="https://www.binghamton.edu/assets/sites/directory/img/hi-res/employee/sford5.jpg?resolution=200"
      alt="Sarah Ford"
    >
  </div>

    <div class="chart-container">
  <canvas id="chart"></canvas>
   </div>

 
    <script>
    const ctx = document.getElementById("chart");

    new Chart(ctx, {
      type: "line",

      data: {
        labels: ["Monday","Tuesday","Wednesday","Thursday","Friday"],
        datasets: [{
          label: "Coffee Spending",
          data: [6.00,12.00,12.00,18.00,18.00],

          borderColor: "FF0145",
          backgroundColor: "#E3DCDC",
          borderWidth: 3,
          fill: true,
          tension: 0.35,

          pointRadius: 4,
          pointBackgroundColor: "FF0145"
        }]
      },

      options: {
        responsive: true,
        maintainAspectRatio: true,

        plugins: {
          legend: {
            display: true
          }
        },

        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
 
</body>
</html>
